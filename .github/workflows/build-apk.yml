name: Build Cashier System APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Accept SDK licenses & install components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"
          
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            
      - name: Make gradlew executable
        run: |
          cd 打包/apk
          chmod +x gradlew
          
      - name: Build debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          cd 打包/apk
          ./gradlew assembleDebug --no-daemon --stacktrace
          
      - name: List APK output
        run: |
          find . -name "*.apk" -type f
          ls -la 打包/apk/app/build/outputs/apk/debug/ 2>/dev/null || echo "APK not found yet"
          
      - name: Rename APK
        id: rename
        run: |
          APK_PATH=$(find 打包/apk/app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ No APK found!"
            exit 1
          fi
          NEW_NAME="${GITHUB_REPOSITORY_OWNER:-cashier}-debug-${{ github.run_number }}.apk"
          cp "$APK_PATH" "$NEW_NAME"
          echo "apk_name=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "✅ APK renamed to: $NEW_NAME"
          ls -la "$NEW_NAME"
          
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cashier-debug-apk
          path: ${{ steps.rename.outputs.apk_name }}
          retention-days: 30
          
      - name: Upload APK as release asset (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename.outputs.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
