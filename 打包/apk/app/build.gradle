plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace = "com.qihhao.pos"
    compileSdk = 34

    signingConfigs {
        zqiRelease {
            def storeFilePath = project.findProperty('ZIQI_RELEASE_STORE_FILE') ?: System.getenv('ZIQI_RELEASE_STORE_FILE')
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword project.findProperty('ZIQI_RELEASE_STORE_PASSWORD') ?: System.getenv('ZIQI_RELEASE_STORE_PASSWORD')
                keyAlias project.findProperty('ZIQI_RELEASE_KEY_ALIAS') ?: System.getenv('ZIQI_RELEASE_KEY_ALIAS')
                keyPassword project.findProperty('ZIQI_RELEASE_KEY_PASSWORD') ?: System.getenv('ZIQI_RELEASE_KEY_PASSWORD')
            }
        }
    }

    defaultConfig {
        applicationId "com.qihhao.pos"
        minSdk = 24
        targetSdk = 34
        versionCode = 320
        versionName "3.2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }

        // Chaquopy 15.x: pip packages go inside defaultConfig.python
        python {
            pip {
                // Use Chaquopy's own Android-compatible wheel index (default)
                install "fastapi>=0.115"
                install "uvicorn>=0.32"
                install "pydantic>=2.9"
                install "pydantic-settings>=2.5"
                install "sqlalchemy>=2.0.35"
                install "tomli>=2.0"
                install "python-multipart"
                install "jinja2>=3.1"
                # cryptography >=43 needs Rust (maturin) – Chaquopy has prebuilt wheels 
                # up to 42.0.x; use that version for now
                install "cryptography==42.0.5"
                # httpx: pure-Python, Chaquopy has Android wheel
                install "httpx>=0.27"
                # bcrypt: Chaquopy has Android wheel
                install "bcrypt>=4.1"
                # psutil: Chaquopy has Android wheel
                install "psutil>=5.9"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.findProperty('ZIQI_RELEASE_STORE_FILE') ?: System.getenv('ZIQI_RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.zqiRelease
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt']
        }
    }

    lint {
        abortOnError false
    }

    // Chaquopy: Python source dirs (project root)
    sourceSets {
        main {
            python {
                srcDir "../../../../../"
            }
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'

    // WebView
    implementation 'androidx.webkit:webkit:1.9.0'

    // USB Serial for Android (usb-serial-for-android by mik3y) - needs JitPack
    implementation 'com.github.mik3y:usb-serial-for-android:3.7.0'

    // Gson for JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'

    // OkHttp
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Logging
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // Test
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Copy static files for embedding
tasks.register('copyStaticAsset', Copy) {
    from "../../../../../static"
    into "$buildDir/intermediates/python/assets/source/static"
}
preBuild.dependsOn copyStaticAsset

// Copy config files
tasks.register('copyConfigAsset', Copy) {
    from "../../../../../config"
    into "$buildDir/intermediates/python/assets/source/config"
}
preBuild.dependsOn copyConfigAsset
