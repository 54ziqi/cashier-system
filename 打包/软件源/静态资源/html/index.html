<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>柒号收银 — 智能收银管理系统</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/pages.css">
  <link rel="stylesheet" href="/static/css/brand.css">
  <link rel="stylesheet" href="/static/css/ui-upgrade.css">
  <link rel="stylesheet" href="/static/css/toast.css">
  <link rel="stylesheet" href="/static/css/motion.css">
  <link rel="stylesheet" href="/static/css/notify.css">

  <!-- M1 模块样式 -->
  <link rel="stylesheet" href="/static/css/m1-tables.css">
  <link rel="stylesheet" href="/static/css/m1-specs.css">
  <link rel="stylesheet" href="/static/css/m1-receipt.css">
  <link rel="stylesheet" href="/static/css/m1-pages.css">
</head>
<body>

<!-- ===== Toast 容器 ===== -->
<div id="toast-container"></div>

<!-- ===== 取餐号 Banner (快餐模式) ===== -->
<div id="pickup-banner" class="pickup-banner" style="display:none;">
  <span class="pickup-icon">🔔</span>
  <span class="pickup-text">请取餐 <strong id="pickup-number">A01</strong></span>
  <button class="pickup-close" onclick="document.getElementById('pickup-banner').style.display='none'">&times;</button>
</div>

<!-- ===== 登录页 ===== -->
<div id="login-page" class="login-wrap">
  <div class="login-card">
    <div class="brand">
      <div class="logo">7️⃣</div>
      <h1>柒号收银</h1>
      <div class="sub">QIHAO POS · 智能收银管理系统</div>
    </div>
    <div class="field">
      <label>用户名</label>
      <input class="input" id="login-user" type="text" placeholder="请输入用户名" value="admin">
    </div>
    <div class="field">
      <label>密码</label>
      <input class="input" id="login-pass" type="password" placeholder="请输入密码" value="admin">
    </div>
    <div id="login-msg" style="margin-bottom:12px;font-size:13px;min-height:18px;"></div>
    <button class="btn-login" id="login-btn" onclick="App.doLogin()">登 录</button>
    <div class="health" id="login-health">● 正在检查服务状态…</div>
  </div>
</div>

<!-- ===== 主应用 ===== -->
<div id="main-app" style="display:none;flex-direction:column;height:100vh;">

  <!-- 顶部导航栏 -->
  <div class="topbar">
    <div class="brand"><span class="icon">7️⃣</span> 柒号收银</div>
    <div class="time" id="topbar-time"></div>
    <div class="nav">
      <button class="active" data-page="pos" onclick="App.navigate('pos')">🛒 收银</button>
      <button data-page="tables" onclick="App.navigate('tables')">🪑 桌台</button>
      <button data-page="member" onclick="App.navigate('member')">👤 会员</button>
      <button data-page="products" onclick="App.navigate('products')">📦 商品</button>
      <button data-page="hw" onclick="App.navigate('hw')">🔌 设备</button>
      <button data-page="report" onclick="App.navigate('report')">📊 报表</button>
    </div>
    <div class="user">
      <span class="dot"></span>
      <span id="topbar-user"></span>
      <a href="/dashboard" style="color:var(--c-green);font-size:12px;margin-left:8px;">看板</a>
      <span style="cursor:pointer;font-size:12px;color:rgba(255,255,255,.5);margin-left:8px;" onclick="App.logout()">退出</span>
    </div>
  </div>

  <!-- 硬件状态条 -->
  <div class="hw-bar" id="hw-bar"></div>

  <!-- ====== POS 收银页 ====== -->
  <div id="page-pos" class="page active">
    <div class="pos-layout">
      <!-- 左侧购物车 -->
      <div class="pos-cart">
        <div class="cart-header">
          <span>🛒 购物车</span>
          <span id="cart-count" style="font-size:13px;color:var(--c-text-muted)">0 件</span>
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-empty" id="cart-empty" style="display:flex;">
          <div class="icon">🛒</div>
          <div>点击商品添加</div>
        </div>
        <div class="cart-summary">
          <div class="row"><span>商品金额</span><span id="cart-subtotal">¥0.00</span></div>
          <div class="row total"><span>应付合计</span><span id="cart-final">¥0.00</span></div>
        </div>
        <div class="cart-actions">
          <button class="btn btn-outline" id="btn-suspend" onclick="POS.suspendCart()">挂单</button>
          <button class="btn btn-outline" id="btn-resume" onclick="POS.resumeCart()">取单</button>
          <button class="btn btn-outline" id="btn-discount" onclick="POS.applyDiscount()">折扣</button>
          <button class="btn btn-outline" id="btn-clear" onclick="POS.clearCart()">清空</button>
          <button class="btn btn-checkout" id="btn-checkout" onclick="POS.openCheckout()" disabled>确认收款</button>
        </div>
      </div>

      <!-- 右侧商品区 -->
      <div class="pos-products">
        <div class="search-bar">
          <input class="input" id="pos-search" type="text" placeholder="🔍 搜索商品名称或扫描条码…" oninput="POS.handleSearch(this.value)" onkeydown="if(event.key==='Enter')POS.handleSearch(this.value)">
          <button class="btn-scan" id="pos-scan-btn" onclick="BarcodeScanner.toggle()">📷 扫码</button>
          <div id="selected-table-badge" style="display:none;align-items:center;gap:6px;padding:6px 14px;background:var(--c-blue-bg);color:var(--c-blue-text);border-radius:8px;font-size:13px;font-weight:600;">
            <span id="selected-table-label"></span>
            <button onclick="POS.clearTableSelection()" style="font-size:14px;color:var(--c-red);background:none;border:none;cursor:pointer;">×</button>
          </div>
        </div>
        <div class="product-grid" id="product-grid"></div>
      </div>
    </div>
  </div>

  <!-- ====== 桌台管理页 (嵌入) ====== -->
  <div id="page-tables" class="page">
    <div class="tables-container">
      <div class="tables-toolbar">
        <button class="btn btn-green" onclick="TablesModule.createNew()">＋ 新建桌台</button>
        <button class="btn btn-outline" id="layout-toggle-btn" onclick="TablesModule.toggleLayout()">布局编辑</button>
        <button class="btn btn-outline" style="margin-left:8px;font-size:12px;" onclick="notify.banner('当前共有 '+TablesModule.activeCount+' 张使用中桌台', {type:'info'})">📊 统计</button>
        <div style="margin-left:auto;display:flex;gap:8px;font-size:12px;color:var(--c-text-muted);align-items:center;">
          <span class="table-legend"><span class="legend-dot" style="background:#94A3B8"></span>空闲</span>
          <span class="table-legend"><span class="legend-dot" style="background:#F59E0B"></span>就餐中</span>
          <span class="table-legend"><span class="legend-dot" style="background:#3B82F6"></span>已预留</span>
          <span class="table-legend"><span class="legend-dot" style="background:#EF4444"></span>待清洁</span>
        </div>
      </div>
      <div class="tables-grid" id="tables-grid"></div>
      <div class="tables-empty" id="tables-empty" style="display:none;">
        <div class="icon">🪑</div>
        <div>暂无桌台，点击"＋ 新建桌台"创建</div>
      </div>
    </div>
  </div>

  <!-- ====== 会员页 ====== -->
  <div id="page-member" class="page">
    <div class="member-shell">
      <div class="member-list-col">
        <div style="padding:14px 18px;border-bottom:1px solid var(--c-border);display:flex;align-items:center;gap:8px;">
          <span style="font-weight:600;font-size:15px;">会员列表</span>
          <span id="member-count" style="font-size:12px;color:var(--c-text-muted);"></span>
        </div>
        <div class="member-search-box">
          <input class="input" type="text" placeholder="🔍 搜索手机号或姓名…">
        </div>
        <div id="member-list" style="flex:1;overflow-y:auto;padding:8px;"></div>
      </div>
      <div class="member-detail-col">
        <div style="text-align:center;">
          <div style="font-size:48px;opacity:0.4;margin-bottom:12px;">👤</div>
          <div style="font-size:16px;color:var(--c-text-muted);">选择左侧会员查看详情</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ====== 设备页 ====== -->
  <div id="page-hw" class="page">
    <div class="hw-shell">
      <div style="margin-bottom:20px;">
        <h2 style="font-size:18px;font-weight:700;margin-bottom:4px;">外设管理</h2>
        <p style="font-size:13px;color:var(--c-text-muted);">管理 POS 硬件设备连接状态</p>
      </div>
      <div class="hw-grid" id="hw-grid"></div>
    </div>
  </div>

  <!-- ====== 报表页 ====== -->
  <div id="page-report" class="page">
    <div class="report-shell">
      <h2 style="font-size:18px;font-weight:700;margin-bottom:16px;">今日经营概况</h2>
      <div class="report-grid report-summary">
        <div class="report-card card">
          <div class="value">¥0</div>
          <div class="label">今日销售额</div>
        </div>
        <div class="report-card card">
          <div class="value">0</div>
          <div class="label">今日订单数</div>
        </div>
        <div class="report-card card">
          <div class="value">¥0</div>
          <div class="label">客单价</div>
        </div>
        <div class="report-card card">
          <div class="value">—</div>
          <div class="label">同比昨日</div>
        </div>
      </div>
      <div class="report-card card" style="padding:24px;text-align:center;color:var(--c-text-muted);">
        <div style="font-size:36px;margin-bottom:8px;">📊</div>
        <div>更多报表功能敬请期待</div>
      </div>
    </div>
  </div>

  <!-- ====== 商品管理页 ====== -->
  <div id="page-products" class="page">
    <div class="products-shell">
      <div class="products-sidebar" id="product-categories-tree">
        <div id="category-list" style="padding:4px 0;">
          <div class="cat-item active" data-cat=""><span>📦 全部</span></div>
        </div>
        <div style="padding:8px;margin-top:8px;border-top:1px solid var(--c-border-light);">
          <button class="btn btn-outline" style="width:100%;font-size:12px" onclick="ProductManage.addCategory()">＋ 新建分类</button>
        </div>
      </div>
      <div class="products-main-col">
        <div class="toolbar">
          <input class="input" id="product-search" placeholder="🔍 搜索商品编号或名称…" oninput="ProductManage.search(this.value)">
          <button class="btn btn-green" onclick="ProductManage.openAddModal()">＋ 新建商品</button>
          <button class="btn btn-outline" style="font-size:12px;color:var(--c-text-muted)" onclick="notify.info('批量功能暂仅支持上架/下架操作')">批量操作</button>
        </div>
        <div class="product-table-wrap">
          <table class="data-table" id="product-data-table">
            <thead>
              <tr><th>商品名称</th><th>分类</th><th>价格</th><th>库存</th><th>条码</th><th>状态</th><th>操作</th></tr>
            </thead>
            <tbody id="product-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- ===== 脚本加载 ===== -->
<script src="/static/js/toast.js"></script>
<script src="/static/js/qh-modal.js"></script>
<script src="/static/js/notify.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/pos.js"></script>
<script src="/static/js/products.js"></script>
<script src="/static/js/barcode.js"></script>
<script src="/static/js/hw.js"></script>
<script src="/static/js/member.js"></script>
<script src="/static/js/report.js"></script>
<script src="/static/js/product-manage.js"></script>

<!-- M1 新增模块 -->
<script src="/static/js/spec-modal.js"></script>
<script src="/static/js/receipt.js"></script>
<script src="/static/js/tables-module.js"></script>
<script src="/static/js/order-detail.js"></script>

<script src="/static/js/app.js"></script>

</body>
</html>
