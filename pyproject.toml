[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cashier"
version = "3.2.0"
description = "\u8f7b\u91cf\u7ea7\u79bb\u7ebf\u6536\u94f6\u7cfb\u7edf"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.35",
    "bcrypt>=4.2",
    "cryptography>=43.0",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
hardware = ["pyserial>=3.5", "python-escpos>=3.1", "qrcode[pil]>=7.4"]
pay = ["httpx>=0.27"]
cloud = ["httpx>=0.27"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
cashier = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["../config/*.toml", "../static/*"]
